aid: pharmeasy
name: Pharmeasy
description: >-
  PharmEasy is one of India's largest digital healthcare platforms, operating a
  consumer online pharmacy and health marketplace at pharmeasy.in. It lets users
  order prescription and over-the-counter medicines (with prescription upload and
  verification), buy health and wellness products, book diagnostic lab tests and
  health checkup packages, and consult doctors via telemedicine, plus a PLUS
  subscription for recurring savings. Surfaced as a portfolio company of Bessemer
  Venture Partners and Prosus Ventures and added to the API Evangelist network for
  enrichment. PharmEasy runs an internal API at api.pharmeasy.in but publishes no
  public developer program, API documentation, SDKs, or OpenAPI; it does operate a
  responsible-disclosure security program (infosec@pharmeasy.in). Sector:
  healthcare / e-pharmacy.
